[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omeinsum"
version = "0.1.0"
description = "Blocked einsum with per-GPU checkpointing and multi-GPU dispatch."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Qi Yang" }]
dependencies = [
    "opt-einsum>=3.4.0",
    "torch>=2.1.0",
]
keywords = ["einsum", "pytorch", "gpu", "checkpoint", "cuda", "multi-gpu"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "numpy>=1.22",
    "pytest>=7.0",
]
omeco = [
    "omeco>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/qyang/omeinsum"
Repository = "https://github.com/qyang/omeinsum"

[tool.setuptools.packages.find]
where = ["src"]
